<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Linear Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Base Layer Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="320" fill="url(#cyberGrid)" rx="16"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="#00f2fe" opacity="0.06"/>
  <circle cx="1050" cy="160" r="220" fill="#7f00ff" opacity="0.1"/>

  <!-- Concentric Security Rings -->
  <circle cx="1030" cy="160" r="130" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
  <circle cx="1030" cy="160" r="85" fill="none" stroke="#e100ff" stroke-width="1" opacity="0.25"/>

  <!-- Vector Shield & Key Icon (Right Side Graphic) -->
  <g transform="translate(980, 100)">
    <!-- Shield Path -->
    <path d="M50 10 L90 30 V70 C90 100 50 120 50 120 C50 120 10 100 10 70 V30 Z" 
          fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="2.5"/>
    <!-- Key Hole -->
    <circle cx="50" cy="50" r="12" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    <path d="M46 58 L54 58 L57 82 L43 82 Z" fill="#00f2fe"/>
  </g>

  <!-- Left Accent Line -->
  <rect x="60" y="70" width="6" height="180" rx="3" fill="url(#accentCyan)"/>

  <!-- Main Title -->
  <text x="85" y="120" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    Awesome Developer Secrets Scanning
  </text>

  <!-- Subtitle -->
  <text x="85" y="160" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    Detect Leaked Credentials, API Keys, Tokens &amp; Private Keys Before Production
  </text>

  <!-- Meta Description -->
  <text x="85" y="198" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Curated Ecosystem of SaaS Security Platforms &amp; Open-Source Tools • DevSecOps
  </text>

  <!-- Category Pills (Bottom Left) -->
  <g transform="translate(85, 224)">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="60" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Git Security</text>

    <rect x="132" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="202" y="18" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pre-Commit Hooks</text>

    <rect x="284" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="354" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CI/CD Pipelines</text>
  </g>
</svg>
